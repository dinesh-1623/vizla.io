<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geocoding API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
        }
        input, button {
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #333;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
        .error {
            color: #ff6b6b;
        }
        .success {
            color: #51cf66;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Google Geocoding API Test</h1>
        <p>This page tests your Google Maps API key directly.</p>
        
        <label for="apiKey">API Key:</label>
        <input type="text" id="apiKey" placeholder="Enter your Google Maps API key" value="AIzaSyANCh9pASt1dZplRwC-C9iTUCXZ-d4ptKo">
        
        <label for="address">Address to Geocode:</label>
        <input type="text" id="address" placeholder="e.g., 720 S college mall road, Bloomington, IN 47401" value="720 S college mall road, Bloomington, IN 47401">
        
        <button onclick="testGeocoding()">Test Geocoding</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function testGeocoding() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const address = document.getElementById('address').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!apiKey) {
                resultDiv.innerHTML = '<span class="error">❌ Please enter an API key</span>';
                return;
            }
            
            if (!address) {
                resultDiv.innerHTML = '<span class="error">❌ Please enter an address</span>';
                return;
            }
            
            resultDiv.innerHTML = '🔄 Testing...';
            
            try {
                const url = `https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(address)}&key=${apiKey}`;
                
                console.log('Request URL:', url.replace(apiKey, 'API_KEY_HIDDEN'));
                
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('Full API Response:', data);
                
                let html = '<h3>API Response:</h3>';
                html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                
                if (data.status === 'OK') {
                    html += '<h3 class="success">✅ SUCCESS!</h3>';
                    if (data.results && data.results.length > 0) {
                        const location = data.results[0].geometry.location;
                        html += `<p class="success">📍 Coordinates: ${location.lat}, ${location.lng}</p>`;
                        html += `<p class="success">📍 Formatted Address: ${data.results[0].formatted_address}</p>`;
                    }
                } else if (data.status === 'REQUEST_DENIED') {
                    html += '<h3 class="error">❌ REQUEST DENIED</h3>';
                    html += `<p class="error">Error: ${data.error_message || 'No error message'}</p>`;
                    html += '<p><strong>Possible causes:</strong></p>';
                    html += '<ul>';
                    html += '<li>API key is invalid or expired</li>';
                    html += '<li>Geocoding API is not enabled in Google Cloud Console</li>';
                    html += '<li>API key restrictions are blocking this request</li>';
                    html += '<li>Billing is not enabled for the Google Cloud project</li>';
                    html += '</ul>';
                } else if (data.status === 'OVER_QUERY_LIMIT') {
                    html += '<h3 class="error">❌ QUOTA EXCEEDED</h3>';
                    html += '<p class="error">Your API quota has been exceeded. Check Google Cloud Console.</p>';
                } else if (data.status === 'ZERO_RESULTS') {
                    html += '<h3 class="error">❌ NO RESULTS</h3>';
                    html += '<p class="error">Address not found. Try adding city and state.</p>';
                } else {
                    html += `<h3 class="error">❌ ERROR: ${data.status}</h3>`;
                    html += `<p class="error">${data.error_message || 'Unknown error'}</p>`;
                }
                
                resultDiv.innerHTML = html;
                
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ Network Error: ${error.message}</span>`;
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
